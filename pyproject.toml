[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fst-uofc"
version = "0.1.0"
description = "Python bindings for the General Fourier Family Transform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
]

[tool.setuptools]
packages = ["pygft"]

[dependency-groups]
dev = [
    "cython>=3.0",
    "matplotlib>=3.7",
    "pytest>=7.0",
    "ipykernel>=6.0",
    "ipympl>=0.9",
    "ipywidgets>=8.0",
]
